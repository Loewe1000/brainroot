name: Handbuch veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys nach `main` gehoeren serialisiert -- es gibt nur eine Seite, und der
# neueste Stand gewinnt. Ein Pull Request braucht dagegen seine eigene Spur:
# mit einer festen Gruppe verdraengt jeder PR jeden anderen, und was uebrig
# bleibt, sieht aus wie ein Fehlschlag statt nach einem Abbruch. Zweimal
# passiert, beide Male eine halbe Stunde Suche.
concurrency:
  group: >-
    ${{ github.event_name == 'push' && 'github-pages'
        || format('github-pages-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    name: Seite bauen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Die ganze Geschichte samt Tags wird fuer die versionierten
          # Handbuecher gebraucht.
          fetch-depth: 0

      - name: Typst-Schule danebenlegen
        uses: actions/checkout@v4
        with:
          # docs/docs.typ setzt auf @schule/schuldocs, und das liegt dort. Von
          # dort kommt außerdem der Erzeuger der Beispiel-Übersicht — eine
          # zweite Fassung davon würde nur abdriften.
          repository: Loewe1000/Typst-Schule
          path: .aggregat
          fetch-depth: 1

      - name: Typst installieren
        uses: typst-community/setup-typst@v4
        with:
          # Festgenagelt, nicht `latest`: Handbuch und Website entstehen in
          # einem Bündel-Lauf hinter `--features bundle`, und das ist
          # ausdrücklich experimentell.
          typst-version: "0.15.0"

      - name: Handbuch bauen
        env:
          AGGREGAT: ${{ github.workspace }}/.aggregat
        run: bash .github/scripts/build-site.sh

      - name: Versionierte Handbuecher bauen
        # Jeder Tag v* bekommt sein Handbuch unter /<tag>/, gebaut mit dem
        # Skript aus genau diesem Tag. So bleibt z. B. der Link im README von
        # @preview/brainroot:0.2.0 auf /v0.2.0/ stehen, auch wenn spaetere
        # Versionen erscheinen. Ein Tag-Push allein deployt nicht (die
        # Umgebung github-pages laesst nur `main` zu): nach einem neuen Tag
        # den Workflow auf `main` von Hand starten oder auf `main` pushen.
        env:
          AGGREGAT: ${{ github.workspace }}/.aggregat
        run: |
          for tag in $(git tag -l 'v*'); do
            echo "=== Handbuch fuer $tag ==="
            wt="$RUNNER_TEMP/brainroot-$tag"
            git worktree add --detach "$wt" "$tag"
            bash "$wt/.github/scripts/build-site.sh"
            mkdir -p "_site/$tag"
            cp -R "$wt/_site/." "_site/$tag/"
            git worktree remove --force "$wt"
          done

      - name: GitHub Pages konfigurieren
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages-Artefakt hochladen
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    name: Auf GitHub Pages deployen
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy auf GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
